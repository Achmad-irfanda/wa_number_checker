name: wa_number_checker
description: "Check whether a phone number is registered on WhatsApp (and/or WhatsApp Business) via on-device contact sync. Android-only; other platforms return unsupported."
version: 0.2.1
homepage: https://github.com/Achmad-irfanda/wa_number_checker
repository: https://github.com/Achmad-irfanda/wa_number_checker

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ">=12.0.1 <14.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.wachecker.wa_number_checker
        pluginClass: WaNumberCheckerPlugin
